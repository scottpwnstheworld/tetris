<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tetris</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #0a0c12;
        color: #c8d4e8;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
      }
      main {
        text-align: center;
        padding: 1.5rem;
        max-width: 28rem;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0;
        font-size: 0.9rem;
        color: #8a96a8;
        line-height: 1.5;
      }
      .boards {
        display: flex;
        gap: 1rem;
        justify-content: center;
        align-items: flex-start;
        margin-bottom: 0.75rem;
      }
      .touch-controls {
        display: flex;
        gap: 0.75rem;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 1rem;
      }
      .touch-controls button {
        font: inherit;
        font-size: 0.95rem;
        padding: 0.65rem 1.1rem;
        border-radius: 0.5rem;
        border: 1px solid #3a4558;
        background: #1a2030;
        color: #c8d4e8;
        touch-action: manipulation;
        cursor: pointer;
      }
      .touch-controls button:active {
        background: #2a3448;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tetris</h1>
      <div class="boards">
        <canvas id="playfield" aria-label="Tetris playfield"></canvas>
        <canvas id="next-preview" aria-label="Next piece preview"></canvas>
      </div>
      <p id="score">Score: 0</p>
      <p id="status">Loading…</p>
      <div class="touch-controls" aria-label="Mobile play controls">
        <button type="button" data-play-action="rotate-ccw">Rotate ↺</button>
        <button type="button" data-play-action="hard-drop">Drop ⬇</button>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
